<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>어디에 버리지? — 부산광역시</title>
<link rel="stylesheet" href="style.css?v=1.1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#005fa8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="부산 분리배출">
<link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>
<div class="wrap">

  <div class="hero-wrap">

    <!-- ★ 구군 선택 필터 바 -->
    <div class="district-bar">
      <div class="district-bar-inner">
        <span class="district-bar-label">📍 부산지역 구군 선택</span>
        <div class="district-select-wrap">
          <select id="districtSelect" class="district-select">
          </select>
        </div>
      </div>
    </div>

<div class="hero">

  <div class="hero-overlay"></div>

  <div class="hero-pattern"></div>

  <div class="header">

    <div class="gov-badge">
      <span class="pin">📍</span>
      <span id="govBadgeText">BUSAN DONG-GU</span>
    </div>

   <div id="slogan" class="slogan"></div>

    <div class="hero-divider"></div>

    <h1 id="h1title">
      어디에 <span id="h1em">버리지?</span>
    </h1>

    <p id="h1sub">
      음식물유래 폐기물 분류부터<br>
      생활폐기물 배출방법까지
    </p>

    <div id="hero-highlight" class="hero-highlight"></div>

    <div class="quick-icons">

      <div class="qi">
        <div class="qi-icon">♻️</div>
        <div>
    <strong id="quick1Title"></strong>
    <span id="quick1Sub"></span>
        </div>
      </div>

      <div class="qi">
        <div class="qi-icon">🧾</div>
        <div>
    <strong id="quick2Title"></strong>
    <span id="quick2Sub"></span>

        </div>
      </div>

      <div class="qi">
        <div class="qi-icon">🌏</div>
        <div>
    <strong id="quick3Title"></strong>
    <span id="quick3Sub"></span>
        </div>
      </div>

    </div>

    <div class="donggu-link">

      <a href="#" target="_blank" rel="noopener noreferrer" id="govLink">

        <img src="linkimage.png" alt="공식누리집">

        <div class="donggu-text">
          <strong id="dongguTitle"></strong>
          <span id="dongguSub"></span>
        </div>

      </a>

    </div>

  </div>
 </div>
</div>
<div class="search-card">
 <div class="lang-row" id="lr"></div>
 <div class="search-heading" id="search-heading">

무엇을 버리시나요?

</div>

<p class="search-desc" id="search-desc">

생활폐기물 품목을 입력하면
올바른 배출방법을 안내합니다.

</p>
  <div class="scard">
    <span class="slb" id="slb"></span>
    <div class="sr">
      <input type="text" id="q" autocomplete="off"/>
      <button id="sb" onclick="go()"></button>
    </div>
    <div class="recycle-hint" id="recycle-hint" style="display:none;">
  ♻️ 재활용품도 검색할 수 있어요
</div>
    <div class="chips">
      <span class="chip-lbl" id="chip-lbl"></span>
      <div id="ch" style="display:flex;flex-wrap:wrap;gap:5px;width:100%;"></div>
    </div>
  </div>
</div>

<div class="result-area" id="ra">
  <div class="empty">
    <div class="ico">&#128465;</div>
    <p id="empty-msg"></p>
  </div>
</div>


<div id="feedbackBox">
</div>


  
  <div class="fine-banner" id="fn"></div>

<div class="schedule-section">

  <div class="schedule-title" id="schedule-title">
    배출요일 안내
  </div>

  <!-- 구군에 따라 이미지 또는 안내 카드로 동적 교체 -->
  <div id="schedule-section-inner">
    <a id="schedule-link"
       href="schedule-ko.jpg"
       target="_blank">
      <img
        id="schedule-image"
        src="schedule-ko.jpg"
        alt="배출요일 안내">
    </a>
  </div>

</div>

<!-- 구군별 동적 렌더링 영역 -->
<div id="link-buttons-section"></div>
<div id="contact-section"></div>
<div id="bulk-section"></div>

<footer>본 서비스는 주민 편의 증대를 위해 직원이 자발적으로 기획·개발하였습니다 </footer>
</div>

<script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script defer src="utils.js"></script>
<script defer src="districts.js"></script>
<script defer src="data.js"></script>
<script defer src="app.js"></script>


</body>
</html>
